name: CI

on:
  pull_request:
  push:
    branches:
      - master
    tags: "*"
  workflow_dispatch:

concurrency:
  # Skip intermediate builds: all builds except for builds on the `master` branch
  # Cancel intermediate builds: only pull request builds
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref != 'refs/heads/master' || github.run_number }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  finalize:
    needs: [format, test]
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: |
          needs.format.result == 'failure' || needs.format.result == 'skipped' ||
          needs.test.result == 'failure' || needs.test.result == 'skipped'

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Install runic
        run: |
          julia --project=@runic --startup-file=no -e 'using Pkg; Pkg.add("Runic")'
          cat > runic <<'SCRIPT'
          #!/bin/sh
          export JULIA_LOAD_PATH="@runic"
          exec julia --startup-file=no -e 'using Runic; exit(Runic.main(ARGS))' -- "$@"
          SCRIPT
          chmod +x runic
          echo "$PWD" >> "$GITHUB_PATH"
      - run: just fmt-check

  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.6"
          - "1.10"
          - "nightly"
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        arch:
          - x64

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      - uses: actions/cache@v4
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-test-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-test-
            ${{ runner.os }}-

      - uses: julia-actions/julia-buildpkg@v1

      - uses: julia-actions/julia-runtest@v1
        continue-on-error: ${{ matrix.version == 'nightly' }}

      - uses: julia-actions/julia-processcoverage@v1

      - uses: codecov/codecov-action@v5
        with:
          file: lcov.info
